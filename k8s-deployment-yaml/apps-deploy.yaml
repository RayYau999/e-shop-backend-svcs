# --- 1. Payment Service (最底層，被 Login 呼叫) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
    spec:
      containers:
        - name: payment
          image: payment-service:local
          imagePullPolicy: IfNotPresent
          env:
            # 從 Secret 讀取完整的 DB URL (包含 Timezone 設定)
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: eshop-secrets
                  key: DB_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: eshop-secrets
                  key: DB_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eshop-secrets
                  key: DB_PASS
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-svc:9092"

            # --- 修正 placeholder 報錯的關鍵部分 ---
            - name: ESHOP_CLIENT_MAIL
              valueFrom:
                secretKeyRef:
                  name: eshop-secrets
                  key: CLIENT_MAIL
            - name: ESHOP_SPRING_MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: eshop-secrets
                  key: MAIL_USERNAME
            - name: ESHOP_SPRING_MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eshop-secrets
                  key: MAIL_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: payment
spec:
  selector:
    app: payment
  ports:
    - port: 8081
      targetPort: 8081
---
# --- 2. Login Service ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: login-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: login
  template:
    metadata:
      labels:
        app: login
    spec:
      containers:
        - name: login
          image: login-service:local
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: eshop-secrets
                  key: DB_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: eshop-secrets
                  key: DB_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eshop-secrets
                  key: DB_PASS
            - name: ESHOP_PYMT_SERVICE_URL
              value: "http://payment:8081"
---
apiVersion: v1
kind: Service
metadata:
  name: login
spec:
  selector:
    app: login
  ports:
    - port: 8080
      targetPort: 8080
---
# --- 3. API Gateway ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: eshop-api-gateway:local
          imagePullPolicy: IfNotPresent
          env:
            - name: ESHOP_LOGIN_SERVICE_URL
              value: "http://login:8080"
            - name: ESHOP_PYMT_SERVICE_URL
              value: "http://payment:8081"
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: eshop-secrets
                  key: DB_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: eshop-secrets
                  key: DB_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eshop-secrets
                  key: DB_PASS
            - name: ESHOP_OLLAMA_URL
              value: "http://ollama:11434"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - port: 8083
      targetPort: 8083
      nodePort: 30083