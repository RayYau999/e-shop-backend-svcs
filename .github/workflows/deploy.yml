name: Build and Push Microservices

on:
  push:
    # 當你推送到 main 分支時觸發
    branches: [ "feat/k3s-deployment" ]
  # 允許手動點擊按鈕執行
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version'
        required: true
        default: '0.0.1'

permissions:        # ← 加這裡
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: rayyau999

jobs:
  build-and-push:
#    runs-on: [self-hosted, backend-server] # ← This is using self-host runner with backend-server label
    runs-on: ubuntu-latest
    # 這裡定義你的服務清單
    strategy:
      matrix:
        include:
          - dir: eshop-login-svc
            image: login-service
          - dir: eshop-pymt-svc
            image: payment-service
          - dir: eshop-api-gateway
            image: eshop-api-gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Verify repository layout
        run: |
          echo "workspace=$GITHUB_WORKSPACE"
          pwd
          ls -la
          [ -d payment-library ] && echo "OK payment-library" || (echo "MISSING payment-library" && exit 1)
          [ -d security-library ] && echo "OK security-library" || (echo "MISSING security-library" && exit 1)
          [ -d eshop-api-gateway ] && echo "OK eshop-api-gateway" || (echo "MISSING eshop-api-gateway" && exit 1)

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.dir }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}:${{ github.event.inputs.version || 'latest' }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}:${{ github.sha }}
  deploy:
    needs: build-and-push
    runs-on: [self-hosted, k3s-server]
    env:
      PAYMENT_TAG: ${{ github.sha }}
      LOGIN_TAG: ${{ github.sha }}
      GATEWAY_TAG: ${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to K3s #set env vars and apply k8s yaml
        run: |
          set -e
          echo "PAYMENT_TAG=$PAYMENT_TAG"
          echo "LOGIN_TAG=$LOGIN_TAG"
          echo "GATEWAY_TAG=$GATEWAY_TAG"
          
          # apply base images
          kubectl apply -f k8s-deployment-yaml/mysql-setup.yaml
          kubectl apply -f k8s-deployment-yaml/kafka-setup.yaml
          kubectl apply -f k8s-deployment-yaml/ollama-setup.yaml
          
          # wait for base images to be ready
          kubectl rollout status deployment/mysql-db --timeout=300s
          kubectl rollout status deployment/kafka --timeout=300s
          kubectl rollout status deployment/ollama --timeout=600s

          # healthy check
          kubectl wait --for=condition=Ready pod -l app=mysql --timeout=300s || {
            echo "mysql-db rollout failed, dumping diagnostics..."
            kubectl get pods -l app=mysql -o wide || true
            kubectl describe pod -l app=mysql || true
            kubectl get pvc mysql-pvc || true
            kubectl describe pvc mysql-pvc || true
            kubectl logs deployment/mysql-db --tail=200 || true
            exit 1
          }
          kubectl wait --for=condition=Ready pod -l app=kafka --timeout=300s
          kubectl wait --for=condition=Ready pod -l app=ollama --timeout=600s
          
          kubectl run mysql-check --rm --restart=Never --image=busybox:1.36 -- sh -c 'nc -zvw5 db 3306'
          kubectl run kafka-check --rm --restart=Never --image=busybox:1.36 -- sh -c 'nc -zvw5 kafka-svc 9092'
          kubectl run ollama-check --rm --restart=Never --image=busybox:1.36 -- sh -c 'nc -zvw5 ollama 11434'
          
          envsubst < k8s-deployment-yaml/apps-deploy.yaml | kubectl apply -f -

          kubectl rollout restart deployment/login-service
          kubectl rollout restart deployment/payment-service
          kubectl rollout restart deployment/api-gateway