apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: strip-api
  namespace: default
spec:
  stripPrefix:
    prefixes:
      - /api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: main-ingress
  namespace: default
  annotations:
    # 綁定 Middleware，確保轉發給 Gateway 時移除 /api 前綴
    traefik.ingress.kubernetes.io/router.middlewares: default-strip-api@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          # 前端網頁服務
          - path: /
            pathType: Prefix
            backend:
              service:
                name: my-web-service
                port:
                  number: 8080
          # API Gateway 服務
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8083