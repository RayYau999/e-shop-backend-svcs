name: Build and Push Microservices

on:
  push:
    # 當你推送到 main 分支時觸發
    branches: [ "feat/k3s-deployment" ]
  # 允許手動點擊按鈕執行
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version'
        required: true
        default: '0.0.1'

permissions:        # ← 加這裡
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: rayyau999

jobs:
  build-and-push:
    runs-on: [self-hosted, backend-server]
    # 這裡定義你的服務清單
    strategy:
      matrix:
        include:
          - dir: eshop-login-svc
            image: login-service
          - dir: eshop-pymt-svc
            image: payment-service
          - dir: eshop-api-gateway
            image: eshop-api-gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Verify repository layout
        run: |
          echo "workspace=$GITHUB_WORKSPACE"
          pwd
          ls -la
          [ -d payment-library ] && echo "OK payment-library" || (echo "MISSING payment-library" && exit 1)
          [ -d security-library ] && echo "OK security-library" || (echo "MISSING security-library" && exit 1)
          [ -d eshop-api-gateway ] && echo "OK eshop-api-gateway" || (echo "MISSING eshop-api-gateway" && exit 1)

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.dir }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}:${{ github.event.inputs.version || 'latest' }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}:${{ github.sha }}
  deploy:
    needs: build-and-push
    runs-on: [self-hosted, backend-server]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to K3s
        run: |
          kubectl apply -f k8s-deployment-yaml/apps-deploy.yaml

          kubectl rollout restart deployment/login-service
          kubectl rollout restart deployment/payment-service
          kubectl rollout restart deployment/api-gateway